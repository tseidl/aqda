[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqda"
version = "0.3.2"
description = "AQDA — Augmented Qualitative Data Analysis. Local-first QDA with AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Timo Seidl" }]
keywords = ["qualitative-research", "qda", "coding", "social-science", "refi-qda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "pdfplumber>=0.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/tseidl/aqda"
Repository = "https://github.com/tseidl/aqda"
Issues = "https://github.com/tseidl/aqda/issues"

[project.scripts]
aqda = "aqda.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aqda*"]
# Without this, namespace discovery walks the node_modules symlink under
# aqda/frontend/ and packages stray .py files from JS dependencies. The
# pre-built frontend itself still ships, via package-data below.
exclude = ["aqda.frontend*"]
namespaces = false

[tool.setuptools.package-data]
aqda = ["frontend/dist/**/*"]

[tool.ruff]
line-length = 100
