name: Release

# Publishes to PyPI when a version tag is pushed. Authentication uses PyPI
# Trusted Publishing (OIDC), so no API token is stored in this repository.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would try to re-upload an
      # existing version, which PyPI rejects. Fail here instead, with a
      # message that says which side is wrong.
      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
