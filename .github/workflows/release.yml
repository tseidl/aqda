name: Release

# Publishes to PyPI when a version tag is pushed. Authentication uses PyPI
# Trusted Publishing (OIDC), so no API token is stored in this repository.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read # job-level permissions replace the workflow-level block
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would try to re-upload an
      # existing version, which PyPI rejects. Fail here instead, with a
      # message that says which side is wrong.
      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi

      # pyproject is not the only place a version lives. A stale __version__
      # would ship a package that misreports itself, and the artifact cannot
      # be replaced once uploaded.
      - name: Check package __version__ matches pyproject
        run: |
          python - <<'EOF'
          import pathlib, re, sys, tomllib
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          want = cfg["version"]
          mod = cfg["name"].replace("-", "_")
          found = False
          for c in (pathlib.Path("src") / mod / "__init__.py", pathlib.Path(mod) / "__init__.py"):
              if not c.exists():
                  continue
              found = True
              m = re.search(r'__version__\s*=\s*["\']([^"\']+)', c.read_text())
              if not m:
                  sys.exit(f"no __version__ found in {c}")
              if m.group(1) != want:
                  sys.exit(f"{c} has __version__ {m.group(1)}, pyproject has {want}")
              print(f"{c}: {m.group(1)} matches pyproject")
          if not found:
              sys.exit(f"could not locate __init__.py for module {mod}")
          EOF

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
